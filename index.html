<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="body">
    <header class="header"></header>
    <div class="info"></div>

    <form class="form">
      <h2 class="form__title">Регистрация</h2>
      <div class="form__block">
        <div class="form__block-item">
          <label for="first-name"><strong>Имя:</strong></label>
          <input type="text" id="first-name" />
        </div>

        <div class="form__block-item">
          <label for="last-name"><strong>Фамилия:</strong></label>
          <input type="text" id="last-name" />
        </div>

        <div class="form__block-item">
          <label for="login"><strong>Логин:</strong></label>
          <input type="text" id="login" />
        </div>

        <div class="form__block-item">
          <label for="password"><strong>Пароль:</strong></label>
          <input type="password" id="password" />
        </div>
      </div>

      <fieldset class="form__fieldset">
        <legend class="form__fieldset-legend">Ваш пол:</legend>
        <label for="male">
          <input type="radio" id="male" name="gender" value="1" />
          <span>М</span>
        </label>
        <label for="female">
          <input type="radio" id="female" name="gender" value="2" />
          <span>Ж</span>
        </label>
      </fieldset>

      <fieldset class="form__fieldset">
        <legend class="form__fieldset-legend">Ваш статус:</legend>
        <label for="rate-standart">
          <input type="radio" id="rate-standart" name="rate" value="1" />
          <span>Стандарт</span>
        </label>
        <label for="rate-premium">
          <input type="radio" id="rate-premium" name="rate" value="2" checked />
          <span>Премиум</span>
        </label>
        <label for="rate-vip">
          <input type="radio" id="rate-vip" name="rate" value="3" />
          <span>VIP</span>
        </label>
      </fieldset>
      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>

    <section class="users">
      <h2>Все пользователи:</h2>
      <div class="users__form">
        <ul class="users__form__list"></ul>
      </div>
    </section>

    <script src="./DB.js" type="module"></script>
  </body>
</html>
